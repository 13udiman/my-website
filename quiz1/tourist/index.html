<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tourist Places</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container justify-content-center">
            <div class="navbar-nav">
                <a class="nav-link" href="/quiz1">Home</a>
                <a class="nav-link" href="/quiz1/profile">Profile</a>
                <a class="nav-link" href="/quiz1/hometown">Hometown</a>
                <a class="nav-link"href="/quiz1/food">Local Food</a>
                <a class="nav-link" href="/quiz1/tourist">Tourist Places</a>
            </div>
        </div>
    </nav>

    <main class="tourist-container">

        <div class="tourist-heading">
            <p>EXPLORE MY CITY</p>
            <h1>Tourist<br>Places</h1>
        </div>

        <div class="tourist-card tourist-tugu">
            <img src="/images/tugu_pahlawan.jpg" alt="Tugu Pahlawan">
            <div class="tourist-overlay">
                <span>01</span>
                <h2>Tugu Pahlawan</h2>
                <p>An iconic monument representing the history of Surabaya.</p>
            </div>
        </div>

        <div class="tourist-card tourist-tunjungan">
            <img src="/images/tunjungan.jpg" alt="Tunjungan">
            <div class="tourist-overlay">
                <span>02</span>
                <h2>Jalan Tunjungan</h2>
            </div>
        </div>

        <div class="tourist-card tourist-zoo">
            <img src="/images/zoo.jpg" alt="Surabaya Zoo">
            <div class="tourist-overlay">
                <span>03</span>
                <h2>Surabaya Zoo</h2>
            </div>
        </div>

        <div class="tourist-card tourist-north">
            <img src="/images/north_quay.jpg" alt="Surabaya North Quay">
            <div class="tourist-overlay">
                <span>04</span>
                <h2>Surabaya North Quay</h2>
            </div>
        </div>

        <div class="tourist-card tourist-oldtown">
            <img src="/images/kota_lama.jpg" alt="Surabaya Old Town">
            <div class="tourist-overlay">
                <span>05</span>
                <h2>Surabaya Old Town</h2>
            </div>
        </div>

        <div class="tourist-card tourist-bambu">
            <img src="/images/hutan_bambu.jpg" alt="Hutan Bambu">
            <div class="tourist-overlay">
                <span>06</span>
                <h2>Hutan Bambu</h2>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/script.js"></script>

</body>
</html>
